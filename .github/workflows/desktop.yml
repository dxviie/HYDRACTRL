name: Desktop app

# Builds the packaged desktop app for macOS (Apple Silicon and Intel) and
# Windows, and smoke-tests a Linux directory build. Runs for pull requests
# that touch the app, on demand, and from the Release workflow, which asks for
# signed builds. Builds are unsigned (ad-hoc signed on macOS) unless signing
# credentials are configured as repository secrets; see RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign (and notarize) with the credentials in the repository secrets
        type: boolean
        default: false
  workflow_call:
    inputs:
      sign:
        type: boolean
        default: false
  pull_request:
    paths:
      - "desktop/**"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-15
            platform: mac
            args: --mac --arm64
          - name: macOS (Intel)
            os: macos-15-intel
            platform: mac
            args: --mac --x64
          - name: Windows (x64)
            os: windows-latest
            platform: win
            args: --win --x64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Install desktop dependencies
        run: bun install --frozen-lockfile
        working-directory: desktop

      - name: Run desktop tests
        run: bun test src scripts
        working-directory: desktop

      - name: Package
        shell: bash
        working-directory: desktop
        env:
          # Never pick up a random identity from the runner's keychain
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # macOS: a Developer ID Application certificate (.p12, base64) and
          # Apple credentials for notarization
          CSC_LINK: ${{ inputs.sign && matrix.platform == 'mac' && secrets.MAC_CERTIFICATE_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.sign && matrix.platform == 'mac' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ inputs.sign && matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.sign && matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.sign && matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          # Windows: a code-signing certificate (.p12/.pfx, base64)
          WIN_CSC_LINK: ${{ inputs.sign && matrix.platform == 'win' && secrets.WINDOWS_CERTIFICATE_P12_BASE64 || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ inputs.sign && matrix.platform == 'win' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: |
          # electron-builder treats a variable that is set but empty as a
          # certificate path, so drop the ones without a secret behind them
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "$WIN_CSC_LINK" ]; then unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; fi
          args="${{ matrix.args }} --publish never"
          if [ "${{ matrix.platform }}" = "mac" ] && [ -z "$CSC_LINK" ]; then
            # Without a certificate, sign ad hoc (Apple Silicon Macs refuse to
            # open a downloaded app with no signature at all) and don't try
            # to notarize. With one, electron-builder signs, and notarizes
            # when the Apple credentials are set.
            args="$args -c.mac.identity=-"
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          echo "electron-builder $args"
          bunx electron-builder $args

      - uses: actions/upload-artifact@v4
        with:
          name: hydractrl-desktop-${{ matrix.platform }}-${{ runner.arch }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
          if-no-files-found: error

  smoke:
    name: Linux smoke test (packaged app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Install desktop dependencies
        run: bun install --frozen-lockfile
        working-directory: desktop

      - name: Package a directory build
        run: bunx electron-builder --linux --dir
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Smoke test under Xvfb
        run: xvfb-run -a --server-args="-screen 0 1600x1000x24" node scripts/smoke.mjs --software-gl
        working-directory: desktop
