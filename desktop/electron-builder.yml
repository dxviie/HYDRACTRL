# Packaging for the HYDRACTRL desktop app.
#
# The HYDRACTRL server is compiled into a single Bun binary for the target
# platform by scripts/before-pack.cjs and shipped under resources/server next
# to the web assets. Native texture-sharing modules stay outside the asar.
appId: dev.d17e.hydractrl
productName: HYDRACTRL
copyright: Copyright © 2026 D17E · Built on hydra by Olivia Jack · AGPL-3.0
# No version in the file names: the landing page links to
# github.com/dxviie/HYDRACTRL/releases/latest/download/<name>, so these must
# stay stable (src/site/downloads.js, checked by src/site/downloads.test.js).
artifactName: ${productName}-${os}-${arch}.${ext}

directories:
  output: dist
  buildResources: resources

files:
  - package.json
  - resources/icon.png
  - src/**/*
  - "!src/**/*.test.js"
  - "!**/.DS_Store"

asarUnpack:
  - node_modules/@napolab/**

extraResources:
  - from: .server-staging/current
    to: server

beforePack: scripts/before-pack.cjs
# Restores the symlinks of the Syphon framework that npm flattens, so macOS
# signing accepts it
afterPack: scripts/after-pack.cjs

npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
publish: null

mac:
  category: public.app-category.video
  # The DMG is the download (landing page, release notes). A ZIP of the app
  # would only be needed for auto-updates (Squirrel.Mac), which the app
  # doesn't do, and would double every macOS artifact.
  target:
    - dmg
  icon: resources/icon.png
  darkModeSupport: true
  minimumSystemVersion: "11.0"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  # Signing needs a Developer ID certificate (CSC_LINK / CSC_KEY_PASSWORD);
  # without one, pass -c.mac.identity=- -c.mac.timestamp=none for an ad-hoc
  # signature (those can't be timestamped). Notarization runs whenever Apple
  # credentials are in the environment (APPLE_API_KEY, APPLE_API_KEY_ID and
  # APPLE_API_ISSUER, or APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and
  # APPLE_TEAM_ID); see RELEASING.md.
  extendInfo:
    NSMicrophoneUsageDescription: HYDRACTRL listens to the microphone for audio-reactive sketches (a.fft).
    NSCameraUsageDescription: HYDRACTRL uses the camera when a sketch calls s0.initCam().
    NSRequiresAquaSystemAppearance: false

dmg:
  sign: false

win:
  target:
    - nsis
  icon: resources/icon.png

nsis:
  artifactName: ${productName}-${os}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: HYDRACTRL
  deleteAppDataOnUninstall: false

# Linux is not a supported output platform (no Syphon/Spout); this target only
# exists so the packaging pipeline can be exercised on Linux CI runners.
linux:
  target:
    - dir
  category: AudioVideo
  icon: resources/icon.png
